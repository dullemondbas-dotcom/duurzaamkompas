name: Validate Mijn Kompas

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "mijn-kompas.html"
      - "integrations/homewizard-p1/**"
      - ".github/workflows/validate-mijn-kompas.yml"
  pull_request:
    paths:
      - "mijn-kompas.html"
      - "integrations/homewizard-p1/**"
      - ".github/workflows/validate-mijn-kompas.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate app and local P1 bridge
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bridge dependencies
        run: python -m pip install -r integrations/homewizard-p1/requirements.txt

      - name: Compile Python source
        run: |
          python -m py_compile \
            integrations/homewizard-p1/dk_homewizard_bridge.py \
            integrations/homewizard-p1/install_cert.py \
            integrations/homewizard-p1/test_normalize.py

      - name: Run P1 normalization tests
        run: python -m unittest discover -s integrations/homewizard-p1 -p 'test_*.py' -v

      - name: Check legacy Mijn Kompas route
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("mijn-kompas.html").read_text(encoding="utf-8")
          if "energie-challenge.html" not in page or "window.location.replace" not in page:
              raise SystemExit("Legacy Mijn Kompas page must forward to the integrated Energie Challenge app.")
          print("Legacy Mijn Kompas route forwards to the central app.")
          PY