name: Validate Mijn Energie

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "energie-challenge.html"
      - "energie-challenge.css"
      - "energie-challenge.js"
      - "energie-challenge-sw.js"
      - "supabase-auth.js"
      - "mijn-kompas.html"
      - "integrations/homewizard-p1/**"
      - "supabase/migrations/**"
      - ".github/workflows/validate-mijn-kompas.yml"
  pull_request:
    paths:
      - "energie-challenge.html"
      - "energie-challenge.css"
      - "energie-challenge.js"
      - "energie-challenge-sw.js"
      - "supabase-auth.js"
      - "mijn-kompas.html"
      - "integrations/homewizard-p1/**"
      - "supabase/migrations/**"
      - ".github/workflows/validate-mijn-kompas.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate integrated Mijn Energie app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bridge dependencies
        run: python -m pip install -r integrations/homewizard-p1/requirements.txt

      - name: Compile Python source
        run: |
          python -m py_compile \
            integrations/homewizard-p1/dk_homewizard_bridge.py \
            integrations/homewizard-p1/install_cert.py \
            integrations/homewizard-p1/test_normalize.py

      - name: Run P1 normalization tests
        run: python -m unittest discover -s integrations/homewizard-p1 -p 'test_*.py' -v

      - name: Check JavaScript syntax
        run: |
          node --check energie-challenge.js
          node --check supabase-auth.js
          node --check energie-challenge-sw.js

      - name: Check integrated page feature hooks
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("energie-challenge.html").read_text(encoding="utf-8")
          js = Path("energie-challenge.js").read_text(encoding="utf-8")
          css = Path("energie-challenge.css").read_text(encoding="utf-8")
          required_html = [
              'id="view-dashboard"',
              'id="view-history"',
              'id="view-connections"',
              'id="liveEnergyChart"',
              'id="energyTariffForm"',
              'id="energyScenarioForm"',
              'id="downloadHomeWizardConfig"',
          ]
          required_js = [
              "subscribeEnergyMeasurements",
              "listRecentEnergyMeasurements",
              "saveHouseholdEnergyTariff",
              "saveEnergyScenarioSnapshot",
              "startLiveEnergyUpdates",
              "renderLiveEnergyChart",
          ]
          missing = [item for item in required_html if item not in html]
          missing += [item for item in required_js if item not in js]
          if missing:
              raise SystemExit("Missing integrated Mijn Energie hooks: " + ", ".join(missing))
          if "live-energy-svg" not in js or ".live-energy-svg" not in css:
              raise SystemExit("Live P1 chart markup and styling are not both present.")
          print("Integrated Mijn Energie feature hooks found.")
          PY

      - name: Check legacy Mijn Kompas route
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("mijn-kompas.html").read_text(encoding="utf-8")
          if "energie-challenge.html" not in page or "window.location.replace" not in page:
              raise SystemExit("Legacy Mijn Kompas page must forward to the integrated Energie Challenge app.")
          print("Legacy Mijn Kompas route forwards to the central app.")
          PY
